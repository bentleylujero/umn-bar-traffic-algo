<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Signal Flow — UMN Bar Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inconsolata:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #080508;
      --card: #0f0c12;
      --card2: #13101a;
      --amber: #e8a020;
      --amber-b: #ffb533;
      --cream: #ede0cc;
      --c60: rgba(237, 224, 204, .6);
      --c30: rgba(237, 224, 204, .3);
      --c12: rgba(237, 224, 204, .12);
      --border: rgba(232, 160, 32, .13);
      --fd: 'Anton', sans-serif;
      --fm: 'Inconsolata', monospace;
      --raw: #0bc5ea;
      --ctx: #a78bfa;
      --intent: #e8a020;
      --ml: #34d399;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--cream);
      font-family: var(--fm);
      overflow: hidden
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(0, 190, 255, .018) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 190, 255, .018) 1px, transparent 1px);
      background-size: 52px 52px;
    }

    /* ── HEADER ─────────────────────────────────── */
    .hdr-main {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 5, 8, .95);
      backdrop-filter: blur(12px);
    }

    .hd-left {
      display: flex;
      align-items: baseline;
      gap: 10px
    }

    .hd-logo {
      font-family: var(--fd);
      font-size: 16px;
      letter-spacing: .08em;
      color: var(--amber-b)
    }

    .hd-sub {
      font-size: 8px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--c30)
    }

    .hd-nav {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: .1rem
    }

    .nav-tab {
      font-family: var(--fm);
      font-size: 9px;
      letter-spacing: .22em;
      text-transform: uppercase;
      padding: .28rem .85rem;
      color: var(--c30);
      text-decoration: none;
      border: 1px solid transparent;
      transition: color .2s, border-color .2s;
    }

    .nav-tab:hover {
      color: var(--c60);
      border-color: var(--border)
    }

    .nav-tab.active {
      color: var(--amber);
      border-color: var(--border)
    }

    .hd-right {
      display: flex;
      align-items: center;
      gap: 1.2rem
    }

    .live-badge {
      display: flex;
      align-items: center;
      gap: .4rem;
      font-size: .6rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--amber)
    }

    .live-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 5px var(--amber);
      animation: blink 2.2s ease-in-out infinite
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .3
      }
    }

    /* ── STORY BAR ──────────────────────────────── */
    .story-bar {
      position: fixed;
      top: 52px;
      left: 0;
      right: 0;
      z-index: 90;
      height: 46px;
      display: flex;
      align-items: center;
      padding: 0 22px;
      gap: 9px;
      border-bottom: 1px solid var(--border);
      background: rgba(8, 5, 8, .92);
      backdrop-filter: blur(8px);
    }

    .story-lbl {
      font-size: 7.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--c30);
      margin-right: 3px;
      white-space: nowrap
    }

    .story-btn {
      font-family: var(--fm);
      font-size: 8px;
      letter-spacing: .15em;
      text-transform: uppercase;
      padding: 4px 11px;
      border: 1px solid rgba(255, 255, 255, .1);
      color: var(--c30);
      background: transparent;
      cursor: pointer;
      transition: all .2s;
      border-radius: 1px;
      white-space: nowrap;
    }

    .story-btn:hover {
      color: var(--cream);
      border-color: rgba(255, 255, 255, .25)
    }

    .story-btn.active {
      font-weight: 700
    }

    .story-btn[data-story="date_party"].active {
      color: #f472b6;
      border-color: #f472b6;
      background: rgba(244, 114, 182, .08)
    }

    .story-btn[data-story="game_day"].active {
      color: #fb923c;
      border-color: #fb923c;
      background: rgba(251, 146, 60, .08)
    }

    .story-btn[data-story="kk_tuesday"].active {
      color: #e8a020;
      border-color: #e8a020;
      background: rgba(232, 160, 32, .08)
    }

    .story-btn[data-story="finals"].active {
      color: #60a5fa;
      border-color: #60a5fa;
      background: rgba(96, 165, 250, .08)
    }

    .story-narr {
      margin-left: auto;
      max-width: 460px;
      font-size: 7.5px;
      color: var(--c30);
      letter-spacing: .04em;
      line-height: 1.5;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      transition: color .3s;
    }

    .story-narr.on {
      color: var(--c60)
    }

    /* ── VIEWPORT ───────────────────────────────── */
    #vp {
      position: fixed;
      top: 98px;
      left: 0;
      right: 0;
      bottom: 24px;
      overflow: hidden;
      cursor: grab;
      z-index: 1;
    }

    #vp.drag {
      cursor: grabbing
    }

    #cv {
      position: absolute;
      top: 0;
      left: 0;
      width: 1900px;
      height: 1020px;
      transform-origin: 0 0;
    }

    #psvg {
      position: absolute;
      top: 0;
      left: 0;
      width: 1900px;
      height: 1020px;
      pointer-events: none;
      overflow: visible;
    }

    /* ── COLUMN HEADERS ─────────────────────────── */
    .col-hdr {
      position: absolute;
      top: 4px;
      height: 26px;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 7.5px;
      letter-spacing: .22em;
      text-transform: uppercase;
    }

    .col-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      flex-shrink: 0
    }

    .col-desc {
      font-size: 6.5px;
      opacity: .4;
      letter-spacing: .14em
    }

    /* ── NODE CARDS ─────────────────────────────── */
    .node {
      position: absolute;
      width: 172px;
      background: var(--card);
      border: 1px solid var(--border);
      border-top: 2.5px solid var(--nc, var(--amber));
      padding: 9px 12px 8px;
      cursor: pointer;
      transition: border-color .25s, box-shadow .25s, transform .18s, opacity .3s;
      z-index: 10;
    }

    .node:hover {
      border-color: var(--nc, var(--amber));
      box-shadow: 0 0 20px color-mix(in srgb, var(--nc, var(--amber)) 30%, transparent),
        inset 0 0 22px color-mix(in srgb, var(--nc, var(--amber)) 5%, transparent);
      transform: translateY(-2px);
      z-index: 20;
    }

    .node.dimmed {
      opacity: .1;
      pointer-events: none
    }

    .node.story-lit {
      box-shadow: 0 0 30px color-mix(in srgb, var(--sc, var(--nc)) 50%, transparent),
        inset 0 0 18px color-mix(in srgb, var(--sc, var(--nc)) 8%, transparent);
      border-top-color: var(--sc, var(--nc)) !important;
      opacity: 1 !important;
    }

    .nh {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px
    }

    .ndot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--nc, var(--amber));
      box-shadow: 0 0 4px var(--nc, var(--amber));
      flex-shrink: 0
    }

    .nlabel {
      font-family: var(--fd);
      font-size: 11.5px;
      letter-spacing: .05em;
      flex: 1
    }

    .nbadge {
      font-size: 6.5px;
      letter-spacing: .12em;
      padding: 1px 4px;
      border: 1px solid var(--nc, var(--amber));
      color: var(--nc, var(--amber));
      opacity: .65;
      text-transform: uppercase;
    }

    .ndesc {
      font-size: 8px;
      color: var(--c30);
      line-height: 1.4;
      margin-top: 2px
    }

    .nsigs {
      margin-top: 5px;
      display: flex;
      flex-wrap: wrap;
      gap: 2px
    }

    .nsig {
      font-size: 6.5px;
      padding: 1px 4px;
      background: color-mix(in srgb, var(--nc, var(--amber)) 8%, transparent);
      border: 1px solid color-mix(in srgb, var(--nc, var(--amber)) 18%, transparent);
      color: color-mix(in srgb, var(--nc, var(--amber)) 65%, var(--cream));
      letter-spacing: .07em;
    }

    .node[data-layer="0"] {
      --nc: var(--raw)
    }

    .node[data-layer="1"] {
      --nc: var(--ctx)
    }

    .node[data-layer="2"][data-bar="sallys"] {
      --nc: #fb923c
    }

    .node[data-layer="2"][data-bar="blarneys"] {
      --nc: #facc15
    }

    .node[data-layer="2"][data-bar="kk"] {
      --nc: #c084fc
    }

    .node[data-layer="3"],
    .node[data-layer="4"] {
      --nc: var(--ml)
    }

    /* ── EDGES ───────────────────────────────────── */
    .ep {
      fill: none;
      stroke: rgba(237, 224, 204, .09);
      stroke-width: 1.2;
      transition: stroke .3s, stroke-width .3s, opacity .3s;
    }

    .ep.causal {
      stroke-dasharray: 5 4
    }

    .ep.pass {
      stroke-dasharray: 2 5;
      stroke: rgba(237, 224, 204, .05)
    }

    .ep.hi {
      stroke-width: 1.8
    }

    .ep.lo {
      stroke-width: 0.8;
      stroke: rgba(237, 224, 204, .05)
    }

    .ep.dimmed {
      opacity: .03
    }

    .ep.lit {
      stroke-width: 2.4;
      opacity: 1
    }

    .ep.lit.causal {
      animation: flow 1.8s linear infinite;
      stroke-dasharray: 8 5
    }

    @keyframes flow {
      from {
        stroke-dashoffset: 100
      }

      to {
        stroke-dashoffset: 0
      }
    }

    .eh {
      fill: none;
      stroke: transparent;
      stroke-width: 14;
      cursor: crosshair
    }

    .elbl {
      position: absolute;
      pointer-events: none;
      font-family: var(--fm);
      font-size: 7px;
      letter-spacing: .08em;
      color: var(--c30);
      background: rgba(8, 5, 8, .88);
      padding: 1px 5px;
      white-space: nowrap;
      opacity: 0;
      border: 1px solid rgba(237, 224, 204, .07);
      z-index: 40;
      transition: opacity .15s, color .3s;
    }

    .elbl.lit {
      opacity: 1
    }

    .elbl.dimmed {
      opacity: 0
    }

    /* ── DETAIL PANEL ───────────────────────────── */
    #detail {
      position: fixed;
      right: 0;
      top: 98px;
      bottom: 24px;
      width: 290px;
      z-index: 80;
      background: rgba(12, 9, 16, .97);
      border-left: 1px solid var(--border);
      transform: translateX(100%);
      transition: transform .28s cubic-bezier(.4, 0, .2, 1);
      overflow-y: auto;
      padding: 18px 16px;
    }

    #detail.open {
      transform: translateX(0)
    }

    #det-close {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 8px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--c30);
      cursor: pointer;
      background: none;
      border: none;
      font-family: var(--fm);
    }

    #det-close:hover {
      color: var(--cream)
    }

    .det-layer {
      font-size: 7px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--c30);
      margin-bottom: 7px
    }

    .det-title {
      font-family: var(--fd);
      font-size: 17px;
      letter-spacing: .06em;
      color: var(--amber-b);
      margin-bottom: 8px
    }

    .det-src {
      font-size: 7.5px;
      color: var(--c30);
      margin-bottom: 10px;
      letter-spacing: .08em
    }

    .det-desc {
      font-size: 8.5px;
      color: var(--c60);
      line-height: 1.65;
      margin-bottom: 12px
    }

    .det-h {
      font-size: 7px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--c30);
      margin-bottom: 5px
    }

    .det-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
      margin-bottom: 12px
    }

    .det-pill {
      font-size: 7.5px;
      padding: 2px 6px;
      background: rgba(232, 160, 32, .08);
      border: 1px solid rgba(232, 160, 32, .2);
      color: rgba(232, 160, 32, .75);
      letter-spacing: .06em
    }

    .det-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 3px 0;
      border-bottom: 1px solid var(--c12)
    }

    .det-k {
      font-size: 7.5px;
      color: var(--c60)
    }

    .det-v {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--amber-b)
    }

    /* ── TOOLTIP ────────────────────────────────── */
    #tt {
      position: fixed;
      z-index: 200;
      pointer-events: none;
      background: rgba(12, 9, 16, .98);
      border: 1px solid rgba(232, 160, 32, .28);
      padding: 8px 11px;
      max-width: 270px;
      font-size: 8px;
      color: var(--c60);
      line-height: 1.6;
      opacity: 0;
      transition: opacity .15s;
    }

    #tt.show {
      opacity: 1
    }

    .tt-lbl {
      font-size: 10px;
      color: var(--amber-b);
      font-weight: 700;
      margin-bottom: 3px;
      letter-spacing: .06em
    }

    .tt-type {
      font-size: 7px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--c30);
      margin-bottom: 5px
    }

    /* ── STATUS ──────────────────────────────────── */
    #sbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 24px;
      z-index: 80;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 16px;
      background: rgba(8, 5, 8, .95);
      border-top: 1px solid var(--border);
      font-size: 7.5px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--c30);
    }

    #sbar b {
      color: var(--amber)
    }

    .zctr {
      position: fixed;
      bottom: 34px;
      right: 14px;
      z-index: 81;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .zbtn {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card2);
      border: 1px solid var(--border);
      color: var(--c60);
      cursor: pointer;
      transition: color .2s, border-color .2s;
      font-family: monospace;
      font-size: 14px;
    }

    .zbtn:hover {
      color: var(--amber);
      border-color: var(--amber)
    }

    .zbtn.fit {
      font-size: 8px;
      letter-spacing: 0
    }
  </style>
</head>

<body>

  <!-- HEADER -->
  <header class="hdr-main">
    <div class="hd-left">
      <span class="hd-logo">CROWD INTEL</span>
      <span class="hd-sub">UMN · Dinkytown + Stadium Village</span>
    </div>
    <nav class="hd-nav">
      <a href="index.html" class="nav-tab">Dashboard</a>
      <a href="map.html" class="nav-tab">Map</a>
      <a href="pipeline.html" class="nav-tab active">Pipeline</a>
      <a href="simulations.html" class="nav-tab">Simulations</a>
    </nav>
    <div class="hd-right">
      <div class="live-badge"><span class="live-dot"></span>LIVE</div>
    </div>
  </header>

  <!-- STORY BAR -->
  <div class="story-bar">
    <span class="story-lbl">Highlight path:</span>
    <button class="story-btn" data-story="date_party">Date Party Night</button>
    <button class="story-btn" data-story="game_day">Game Day</button>
    <button class="story-btn" data-story="kk_tuesday">KK Tuesday</button>
    <button class="story-btn" data-story="finals">Finals Week</button>
    <button class="story-btn" data-story="">Clear</button>
    <div class="story-narr" id="snarr"></div>
  </div>

  <!-- VIEWPORT -->
  <div id="vp">
    <div id="cv">
      <svg id="psvg">
        <defs>
          <marker id="ma" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="rgba(237,224,204,.12)" />
          </marker>
          <marker id="mb" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="rgba(237,224,204,.5)" />
          </marker>
        </defs>
      </svg>
    </div>
  </div>

  <!-- DETAIL PANEL -->
  <div id="detail">
    <button id="det-close">✕ close</button>
    <div id="det-body"></div>
  </div>

  <!-- TOOLTIP -->
  <div id="tt">
    <div class="tt-lbl" id="tt-lbl"></div>
    <div class="tt-type" id="tt-type"></div>
    <div id="tt-body"></div>
  </div>

  <!-- STATUS -->
  <div id="sbar">
    SIGNAL FLOW PIPELINE &nbsp;·&nbsp;
    <b id="sn">—</b> NODES &nbsp;·&nbsp;
    <b id="se">—</b> EDGES &nbsp;·&nbsp;
    <b id="sc">—</b> CAUSAL &nbsp;·&nbsp;
    <b id="sa">CONNECTING</b>
  </div>
  <div class="zctr">
    <button class="zbtn" id="zi">+</button>
    <button class="zbtn" id="zo">−</button>
    <button class="zbtn fit" id="zf">FIT</button>
  </div>

  <script>
    const API = 'http://localhost:8001';
    const NW = 172, NH = 88;

    // Node canvas positions (top-left x,y)
    const POS = {
      weather: { x: 44, y: 60 },
      sports: { x: 44, y: 195 },
      calendar: { x: 44, y: 332 },
      greek_life: { x: 44, y: 468 },
      events: { x: 44, y: 604 },
      popular_times: { x: 44, y: 740 },

      greek_social_ctx: { x: 375, y: 70 },
      game_day_ctx: { x: 375, y: 276 },
      specials_clock: { x: 375, y: 520 },
      academic_pressure: { x: 375, y: 730 },

      sallys_intent: { x: 718, y: 95 },
      blarneys_intent: { x: 718, y: 390 },
      kk_intent: { x: 718, y: 695 },

      feature_extractor: { x: 1070, y: 380 },
      predictor: { x: 1430, y: 380 },
    };

    const LAYER_COLS = [
      { x: 44, label: 'RAW SOURCES', desc: 'live providers', color: '#0bc5ea' },
      { x: 375, label: 'CONTEXT INFERENCE', desc: 'cross-signal reasoning', color: '#a78bfa' },
      { x: 718, label: 'BAR INTENT', desc: 'per-bar demand', color: '#e8a020' },
      { x: 1070, label: 'FEATURES', desc: '68-feature ML vector', color: '#34d399' },
      { x: 1430, label: 'PREDICTOR', desc: 'RandomForest output', color: '#34d399' },
    ];

    const STORY_COLORS = {
      date_party: '#f472b6',
      game_day: '#fb923c',
      kk_tuesday: '#e8a020',
      finals: '#60a5fa',
    };

    const STORIES_META = {
      date_party: {
        nodes: new Set(['greek_life', 'calendar', 'greek_social_ctx', 'specials_clock', 'sallys_intent', 'kk_intent', 'feature_extractor', 'predictor']),
        narrative: 'Oct-Nov & Mar-Apr formal season: date parties start 9-10 PM. Greeks pregame at Sally\'s Happy Hour (3-6 PM) for cheap drinks — then migrate to KK, the primary Greek destination (0.90×), by 10 PM.',
      },
      game_day: {
        nodes: new Set(['weather', 'sports', 'calendar', 'game_day_ctx', 'sallys_intent', 'blarneys_intent', 'feature_extractor', 'predictor']),
        narrative: 'Home football: fans surge through Stadium Village (Sally\'s) before kickoff, then post-game crowds migrate north to Dinkytown (Blarney\'s). Rivalry games get 1.5× multiplier.',
      },
      kk_tuesday: {
        nodes: new Set(['calendar', 'specials_clock', 'academic_pressure', 'kk_intent', 'feature_extractor', 'predictor']),
        narrative: 'KK Tuesday: 9 PM-2 AM, +70% boost. A campus institution. Mid-semester social mode 0.80 = busiest non-Greek-event night. KK Thursday +40% (×1.25 when Greek Thu overlaps).',
      },
      finals: {
        nodes: new Set(['calendar', 'academic_pressure', 'sallys_intent', 'blarneys_intent', 'kk_intent', 'feature_extractor', 'predictor']),
        narrative: 'Finals suppression: social_mode = 0.15, multiplier = 0.30×. All bar intent nodes dimmed. Exception: "last night out" surge two days before break starts (+35%).',
      },
    };

    // Embedded topology (used when API is offline)
    const TOPO = {

    // ── STATE ─────────────────────────────────────────────────────────────────────

    // ── RENDER LAYER HEADERS ──────────────────────────────────────────────────────
    function renderHeaders() {
      LAYER_COLS.forEach(col => {
        const d = document.createElement('div');
        d.className = 'col-hdr';
        d.style.cssText = `left:${col.x}px; width:172px; color:${col.color}; top:4px;`;
        d.innerHTML = `<span class="col-dot" style="background:${col.color};box-shadow:0 0 4px ${col.color}"></span>

    // ── PORT POSITIONS ────────────────────────────────────────────────────────────
    function rport(id) { const p = POS[id]; return p ? { x: p.x + NW, y: p.y + NH / 2 } : null }
    function lport(id) { const p = POS[id]; return p ? { x: p.x, y: p.y + NH / 2 } : null }

    // ── RENDER EDGES ──────────────────────────────────────────────────────────────
    function renderEdges() {
      TOPO.edges.forEach((e, i) => {
        const src = rport(e.f), tgt = lport(e.t);
        if (!src || !tgt) return;

        const dx = tgt.x - src.x;
        const c1x = src.x + dx * 0.42, c1y = src.y;
        const c2x = tgt.x - dx * 0.42, c2y = tgt.y;
        const d = `M${src.x},${src.y} C${c1x},${c1y} ${c2x},${c2y} ${tgt.x},${tgt.y}`;
        const eid = `${e.f}__${e.t}__${i}`;

        // Hit area
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        hit.setAttribute('d', d); hit.setAttribute('class', 'eh'); hit.dataset.eid = eid;

        // Visible path
        const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        path.setAttribute('d', d);
        path.setAttribute('marker-end', 'url(#ma)');
        let cls = 'ep';
        if (e.type === 'causal') cls += ' causal';
        if (e.type === 'pass') cls += ' pass';
        if (e.wt === 'hi') cls += ' hi';
        if (e.wt === 'lo') cls += ' lo';
        path.setAttribute('class', cls);
        path.dataset.eid = eid;
        path.dataset.stories = (e.stories || []).join(',');

        svg.appendChild(path);
        svg.appendChild(hit);

        // Label
        const lx = src.x + dx * 0.43;
        const ly = src.y + (tgt.y - src.y) * 0.43 - 11;
        const lbl = document.createElement('div');
        lbl.className = 'elbl';
        lbl.dataset.eid = eid;
        lbl.dataset.stories = (e.stories || []).join(',');
        lbl.textContent = e.lbl || '';
        lbl.style.cssText = `left:${lx}px;top:${ly}px`;
        cv.appendChild(lbl);

        // Hover
        hit.addEventListener('mouseenter', ev => { showEdgeTT(e, ev); lbl.style.opacity = '1' });
        hit.addEventListener('mousemove', moveTT);
        hit.addEventListener('mouseleave', () => {
          hideTT();
          if (!lbl.classList.contains('lit')) lbl.style.opacity = '';
        });
      });
    }

    // ── RENDER NODES ──────────────────────────────────────────────────────────────
    function renderNodes() {
      TOPO.nodes.forEach(n => {
        const p = POS[n.id];
        if (!p) return;

        const el = document.createElement('div');
        el.className = 'node';
        el.dataset.id = n.id;
        el.dataset.layer = n.layer;
        if (n.bar) el.dataset.bar = n.bar;
        el.style.cssText = `left:${p.x}px;top:${p.y}px`;

        const badge = n.type === 'raw' ? 'LIVE'
          : n.type === 'context' ? 'INFER'
            : n.type === 'intent' ? 'INTENT'
              : n.type === 'ml' ? 'ML'
                : 'OUT';

        const sigs = (n.signals || []).slice(0, 3).map(s => `<span class="nsig">${s}</span>`).join('');

        el.innerHTML = `
      <div class="nh">
        <span class="ndot"></span>
        <span class="nlabel">${n.label}</span>
        <span class="nbadge">${badge}</span>
      </div>
      <div class="ndesc">${(n.description || '').slice(0, 68)}…</div>
      <div class="nsigs">${sigs}</div>`;

        el.addEventListener('click', () => openDetail(n));
        el.addEventListener('mouseenter', ev => showNodeTT(n, ev));
        el.addEventListener('mousemove', moveTT);
        el.addEventListener('mouseleave', hideTT);

        cv.appendChild(el);
      });
    }

    // ── STORY HIGHLIGHT ────────────────────────────────────────────────────────────
    function applyStory(sid) {
      activeStory = sid;
      const color = STORY_COLORS[sid] || null;
      const meta = STORIES_META[sid] || null;

      // Narrative
      const narr = document.getElementById('snarr');
      narr.textContent = meta ? meta.narrative : '';
      narr.className = meta ? 'story-narr on' : 'story-narr';

      // Nodes
      document.querySelectorAll('.node').forEach(el => {
        el.style.removeProperty('--sc');
        if (!sid) {
          el.classList.remove('dimmed', 'story-lit');
        } else if (meta && meta.nodes.has(el.dataset.id)) {
          el.classList.remove('dimmed');
          el.classList.add('story-lit');
          el.style.setProperty('--sc', color);
        } else {
          el.classList.remove('story-lit');
          el.classList.add('dimmed');
        }
      });

      // Edges
      document.querySelectorAll('.ep').forEach(el => {
        const stories = el.dataset.stories ? el.dataset.stories.split(',') : [];
        if (!sid) {
          el.classList.remove('dimmed', 'lit');
          el.style.removeProperty('stroke');
          el.setAttribute('marker-end', 'url(#ma)');
        } else if (stories.includes(sid)) {
          el.classList.remove('dimmed');
          el.classList.add('lit');
          el.style.stroke = color;
          el.setAttribute('marker-end', 'url(#mb)');
        } else {
          el.classList.remove('lit');
          el.classList.add('dimmed');
          el.style.removeProperty('stroke');
          el.setAttribute('marker-end', 'url(#ma)');
        }
      });

      // Labels
      document.querySelectorAll('.elbl').forEach(el => {
        const stories = el.dataset.stories ? el.dataset.stories.split(',') : [];
        if (!sid) {
          el.classList.remove('dimmed', 'lit');
          el.style.removeProperty('color');
          el.style.opacity = '';
        } else if (stories.includes(sid)) {
          el.classList.remove('dimmed');
          el.classList.add('lit');
          el.style.color = color;
          el.style.opacity = '1';
        } else {
          el.classList.remove('lit');
          el.classList.add('dimmed');
          el.style.opacity = '0';
        }
      });
    }

    document.querySelectorAll('.story-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const sid = btn.dataset.story;
        document.querySelectorAll('.story-btn').forEach(b => b.classList.remove('active'));
        if (sid && sid !== activeStory) {
          btn.classList.add('active');
          applyStory(sid);
        } else {
          applyStory('');
        }
      });
    });

    // ── DETAIL PANEL ──────────────────────────────────────────────────────────────
    function openDetail(n) {
      const layerNames = ['RAW SOURCE', 'CONTEXT INFERENCE', 'BAR INTENT', 'FEATURE EXTRACTION', 'PREDICTOR'];
      const layerCols = ['var(--raw)', 'var(--ctx)', 'var(--intent)', 'var(--ml)', 'var(--ml)'];

      const lcol = layerCols[n.layer] || 'var(--amber)';

      document.getElementById('det-body').innerHTML = `
    <div class="det-layer" style="color:${lcol}">${lname} · LAYER ${n.layer}</div>

    ${src}
    <div class="det-desc">${n.description || ''}</div>

    <div class="det-pills">${pills}</div>
    <div class="det-h" style="margin-top:1.1rem">⚡ LIVE CONTEXT INSIGHTS</div>
    <div id="det-live"><div class="det-row"><span class="det-k" style="opacity:.5">fetching live analysis…</span></div></div>
    <div class="det-h" style="margin-top:1rem">🛡 WARDEN STATUS</div>
    <div id="det-warden"><div class="det-row"><span class="det-k" style="opacity:.5">checking…</span></div></div>`;

      document.getElementById('detail').classList.add('open');
      fetchLive(n);

    async function fetchLive(n) {
      // ── Fetch insights (what the model INTERPRETS) ─────────────────────────────
      try {
        const [insRes, sigRes] = await Promise.all([
          fetch(`${API}/api/v1/signals/insights`),
          fetch(`${API}/api/v1/signals/live`),
        ]);

        const liveEl = document.getElementById('det-live');
        const wardenEl = document.getElementById('det-warden');
        if (!liveEl) return;

        // ── INSIGHTS PANEL ──────────────────────────────────────────────────────
        if (insRes.ok) {
          const ins = await insRes.json();

          const INSIGHT_CONF = [
            { key: 'academic', icon: '📚', color: '#56a85c', label: 'ACADEMIC' },
            { key: 'greek_life', icon: '🏛', color: '#d868a0', label: 'GREEK LIFE' },
            { key: 'weather', icon: '🌡', color: '#00cfff', label: 'WEATHER' },
            { key: 'athletics', icon: '🏟', color: '#ffb533', label: 'ATHLETICS' },
            { key: 'tv_sports', icon: '📺', color: '#ff8844', label: 'TV SPORTS' },
            { key: 'outlook', icon: '⚡', color: '#e8a020', label: 'OUTLOOK' },
          ];

          liveEl.innerHTML = INSIGHT_CONF.map(c => `
        <div class="det-row" style="flex-direction:column;align-items:flex-start;gap:.2rem;padding:.55rem 0;border-bottom:1px solid rgba(255,255,255,.05)">
          <span style="font-size:.47rem;letter-spacing:.18em;color:${c.color};font-family:'Anton',sans-serif">${c.icon} ${c.label}</span>
          <span class="det-v" style="color:rgba(237,224,204,.75);font-size:.54rem;line-height:1.55;white-space:normal">${ins[c.key] || '—'}</span>
        </div>`).join('');
        } else {
          liveEl.innerHTML = `<div class="det-row"><span class="det-k" style="opacity:.4">API offline</span></div>`;
        }

        // ── WARDEN PANEL ────────────────────────────────────────────────────────
        if (wardenEl && sigRes.ok) {
          const sig = await sigRes.json();
          const now = new Date();

          const weatherFetchedAt = sig?.weather?.fetched_at;
          let wardenRows = '';

          if (weatherFetchedAt) {
            const ageMin = ((now - new Date(weatherFetchedAt)) / 60000).toFixed(1);
            const stale = parseFloat(ageMin) > 120;
            const badge = stale
              ? `<span style="color:#ff5555;font-weight:bold">⚠ STALE (${ageMin} min)</span>`
              : `<span style="color:#44dd44">✓ FRESH (${ageMin} min old)</span>`;
            wardenRows += `<div class="det-row"><span class="det-k">Weather age</span><span class="det-v">${badge}</span></div>`;
          }

          // Academic warden: weekend check
          const isWeekend = [0, 6].includes(now.getDay());
          const calInSess = sig?.calendar?.classes_in_session;
          const calCorrect = isWeekend ? (calInSess === 0) : true;
          wardenRows += `<div class="det-row"><span class="det-k">Calendar (weekend check)</span><span class="det-v" style="color:${calCorrect ? '#44dd44' : '#ff5555'}">${calCorrect ? '✓ correct' : '⚠ classes flagged on weekend!'}</span></div>`;

          // Greek life date-party specificity
          const hasActiveDateParty = sig?.calendar?.classes_in_session !== undefined;
          wardenRows += `<div class="det-row"><span class="det-k">Data integrity</span><span class="det-v" style="color:#44dd44">✓ Warden active — stale data nullified</span></div>`;

          wardenEl.innerHTML = wardenRows || `<div class="det-row"><span class="det-k" style="opacity:.4">No warden data</span></div>`;
        }
      } catch (e) {
        const liveEl = document.getElementById('det-live');
        const wardenEl = document.getElementById('det-warden');
        if (liveEl) liveEl.innerHTML = `<div class="det-row"><span class="det-k" style="opacity:.4">API offline — ${e.message}</span></div>`;
        if (wardenEl) wardenEl.innerHTML = `<div class="det-row"><span class="det-k" style="opacity:.4">API offline</span></div>`;
      }
    }

    document.getElementById('det-close').addEventListener('click', () => {
      document.getElementById('detail').classList.remove('open');
    });

    // ── TOOLTIPS ──────────────────────────────────────────────────────────────────
    const tt = document.getElementById('tt');

    function showEdgeTT(e, ev) {
      document.getElementById('tt-lbl').textContent = e.lbl || '';
      const tmap = { causal: 'CAUSAL INFERENCE', pass: 'NUMERIC PASS-THROUGH', data: 'DATA FLOW' };
      document.getElementById('tt-type').textContent = `${tmap[e.type] || 'DATA FLOW'} · ${(e.wt || 'med').toUpperCase()} WEIGHT`;
      document.getElementById('tt-body').textContent = e.sem || '';
      tt.classList.add('show');
      posTT(ev);
    }

    function showNodeTT(n, ev) {
      const lnames = ['Raw Source', 'Context Inference', 'Bar Intent', 'Feature Extraction', 'Predictor'];
      document.getElementById('tt-lbl').textContent = n.label;
      document.getElementById('tt-type').textContent = lnames[n.layer] || '';
      document.getElementById('tt-body').textContent = (n.description || '').slice(0, 150);
      tt.classList.add('show');
      posTT(ev);
    }

    function posTT(e) {
      let lx = e.clientX + 14, ly = e.clientY - 10;
      if (lx + 285 > window.innerWidth) lx = e.clientX - 295;
      if (ly + 120 > window.innerHeight) ly = e.clientY - 130;
      tt.style.left = lx + 'px';
      tt.style.top = ly + 'px';
    }
    function moveTT(e) { if (tt.classList.contains('show')) posTT(e) }
    function hideTT() { tt.classList.remove('show') }

    // ── PAN & ZOOM ────────────────────────────────────────────────────────────────
    function applyXform() {
      cv.style.transform = `translate(${ox}px,${oy}px) scale(${scale})`;
    }

    function fitView() {
      const vw = vp.clientWidth, vh = vp.clientHeight;
      const sc = Math.min(vw / 1640, vh / 960, 0.96) * 0.9;
      scale = sc;
      ox = (vw - 1640 * sc) / 2 - 20 * sc;
      oy = (vh - 960 * sc) / 2 - 30 * sc;
      applyXform();
    }

    vp.addEventListener('mousedown', e => {
      if (e.button !== 0) return;
      if (e.target.closest('.node') || e.target.closest('.eh')) return;
      dragging = true;
      dx0 = e.clientX; dy0 = e.clientY; ox0 = ox; oy0 = oy;
      vp.classList.add('drag');
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      ox = ox0 + (e.clientX - dx0);
      oy = oy0 + (e.clientY - dy0);
      applyXform();
    });
    window.addEventListener('mouseup', () => { dragging = false; vp.classList.remove('drag') });

    vp.addEventListener('wheel', e => {
      e.preventDefault();
      const f = e.deltaY < 0 ? 1.10 : 0.91;
      const r = vp.getBoundingClientRect();
      const mx = e.clientX - r.left, my = e.clientY - r.top;
      ox = mx - (mx - ox) * f;
      oy = my - (my - oy) * f;
      scale = Math.min(Math.max(scale * f, 0.2), 2.8);
      applyXform();
    }, { passive: false });

    document.getElementById('zi').addEventListener('click', () => { scale = Math.min(scale * 1.18, 2.8); applyXform() });
    document.getElementById('zo').addEventListener('click', () => { scale = Math.max(scale * 0.85, 0.2); applyXform() });
    document.getElementById('zf').addEventListener('click', fitView);

    // ── INIT ──────────────────────────────────────────────────────────────────────
    (async () => {
      document.getElementById('sn').textContent = TOPO.nodes.length;
      document.getElementById('se').textContent = TOPO.edges.length;
      document.getElementById('sc').textContent = TOPO.edges.filter(e => e.type === 'causal').length;

      renderHeaders();
      renderEdges();
      renderNodes();
      fitView();

      // Try to update from live API
      try {
        const r = await fetch(`${API}/api/v1/pipeline/topology`);
        if (r.ok) {
          document.getElementById('sa').textContent = 'API ONLINE';
        } else {
          document.getElementById('sa').textContent = 'API OFFLINE';
        }
      } catch {
        document.getElementById('sa').textContent = 'API OFFLINE';
      }
    })();
  </script>
</body>

</html>
